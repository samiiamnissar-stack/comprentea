<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ComprenTEA</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3E9C93">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F0; --card:#FFFFFF; --ink:#2F3A45; --soft:#6B7785; --line:#E9E2D6;
  --teal:#3E9C93; --teal-soft:#DDF0ED; --sun:#F2B544; --sun-soft:#FCEFD3;
  --rose:#E58C8A; --rose-soft:#FBE3E2; --lav:#8C86C9; --lav-soft:#E7E5F6;
  --sky:#5B9BD5; --sky-soft:#DDEBF7; --ok:#3E9C93; --radius:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
body{user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden}
input,textarea,select{user-select:text;-webkit-user-select:text;font-family:inherit}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{min-height:100%;max-width:1200px;margin:0 auto;padding:16px 18px 40px}
.top{display:flex;align-items:center;gap:12px;min-height:56px;margin-bottom:14px}
.top h1{font-size:26px;font-weight:900;margin:0;flex:1;letter-spacing:.2px}
.iconbtn{width:56px;height:56px;border-radius:18px;background:var(--card);border:2px solid var(--line);font-size:26px;display:grid;place-items:center;flex:none}
.iconbtn:active{transform:scale(.95)}
.pill{padding:10px 16px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:15px;color:var(--soft)}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand .logo{width:44px;height:44px;border-radius:14px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:24px}
.brand b{font-size:28px;font-weight:900}
.hello{font-size:22px;color:var(--soft);font-weight:700;margin:4px 4px 18px}

/* inicio */
.home{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.home .tile:last-child:nth-child(odd){grid-column:1/-1;min-height:150px}
@media(min-width:900px){.home{grid-template-columns:repeat(5,1fr)}.home .tile:last-child:nth-child(odd){grid-column:auto;min-height:200px}}
.tile{border-radius:var(--radius);padding:22px 16px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:28px;font-weight:900;border:3px solid transparent;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .big{font-size:84px;line-height:1}
.t-teal{background:var(--teal-soft);border-color:#C5E6E1}
.t-sun{background:var(--sun-soft);border-color:#F6DFAE}
.t-rose{background:var(--rose-soft);border-color:#F4CBC9}
.t-lav{background:var(--lav-soft);border-color:#D4D1EE}
.t-sky{background:var(--sky-soft);border-color:#C5DCF1}

.parentbtn{position:relative;overflow:hidden}
.parentbtn .fill{position:absolute;left:0;bottom:0;height:100%;width:0;background:var(--teal-soft);z-index:0}
.parentbtn span{position:relative;z-index:1}
.hint{font-size:13px;color:var(--soft);text-align:right;margin-top:-8px;margin-bottom:8px}

/* tablero de pictos */
.strip{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:10px;min-height:110px;margin-bottom:14px}
.strip .slots{display:flex;gap:8px;flex:1;overflow-x:auto;min-height:88px;align-items:center}
.strip .empty{color:#B6AFA3;font-weight:800;font-size:18px;padding-left:8px}
.mini{width:84px;height:88px;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-size:13px;font-weight:800}
.mini .e{font-size:40px;line-height:1.1}
.mini img{width:52px;height:52px;object-fit:cover;border-radius:10px}
.say{background:var(--teal);color:#fff;border-radius:18px;height:88px;padding:0 18px;font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px}
.cats{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.cat{flex:none;padding:12px 18px;border-radius:18px;background:var(--card);border:2px solid var(--line);font-weight:900;font-size:19px;display:flex;align-items:center;gap:8px}
.cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.picto{background:var(--card);border:3px solid var(--line);border-radius:22px;aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:900;font-size:20px;padding:8px;transition:transform .1s}
.picto:active{transform:scale(.95)}
.picto .e{font-size:68px;line-height:1}
.picto img{width:78%;aspect-ratio:1;object-fit:cover;border-radius:16px}
.picto.flash{border-color:var(--teal);background:var(--teal-soft)}
.cat-necesito{border-color:#F6DFAE}.cat-siento{border-color:#F4CBC9}.cat-comida{border-color:#C5E6E1}.cat-jugar{border-color:#C5DCF1}.cat-personas{border-color:#D4D1EE}

/* juegos */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.gtile{border-radius:var(--radius);padding:18px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:26px;font-weight:900;border:3px solid transparent}
.gtile .big{font-size:70px;line-height:1}
.gtile small{font-size:14px;color:var(--soft);font-weight:800}
.play{display:flex;flex-direction:column;align-items:center;gap:20px}
.prompt{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%}
.model.wide{width:auto;min-width:220px;height:auto;min-height:170px;padding:14px 22px}
.model{width:170px;height:170px;border-radius:28px;background:var(--card);border:3px dashed #D9D0C1;display:grid;place-items:center}
.ear{font-size:96px;line-height:1}
.ptext{font-size:22px;font-weight:800;color:var(--soft)}
.opts{display:grid;gap:18px;width:100%;max-width:920px;justify-content:center}
.opt{background:var(--card);border:4px solid var(--line);border-radius:28px;aspect-ratio:1;display:grid;place-items:center;transition:transform .15s,opacity .3s,border-color .2s}
.opt:active{transform:scale(.96)}
.opt.wrong{opacity:.25;pointer-events:none}
.opt.right{border-color:var(--ok);background:var(--teal-soft);transform:scale(1.04)}
.opt.help{animation:pulse 1.4s ease-in-out infinite;border-color:var(--sun)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.dot{width:72%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.dot.white{border:3px solid #D9D0C1}
.emo{font-size:min(16vw,110px);line-height:1}
.num{font-size:min(18vw,120px);font-weight:900;line-height:1;color:var(--ink)}
.shape{width:72%;height:72%}
.count{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;max-width:280px;font-size:52px;line-height:1}
.model .emo{font-size:96px}.model .num{font-size:110px}.model .dot{width:70%}
.progress{display:flex;gap:8px}
.progress i{width:18px;height:18px;border-radius:50%;background:#E6DED0}
.progress i.on{background:var(--sun)}
.done{text-align:center;padding:40px 10px}
.done .stars{font-size:72px;letter-spacing:6px}
.done h2{font-size:36px;margin:14px 0 26px}
.btnrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.bigbtn{padding:20px 30px;border-radius:22px;font-size:24px;font-weight:900;background:var(--teal);color:#fff}
.bigbtn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line)}
.modechip{display:flex;gap:6px}
.modechip button{padding:8px 12px;border-radius:12px;font-weight:800;font-size:14px;background:var(--card);border:2px solid var(--line);color:var(--soft)}
.modechip button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* rutina */
.routine{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.rcard{width:170px;border-radius:24px;background:var(--card);border:3px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:900;font-size:19px;position:relative}
.rcard .e{font-size:72px;line-height:1}
.rcard img{width:110px;height:110px;object-fit:cover;border-radius:16px}
.rcard.now{border-color:var(--teal);background:var(--teal-soft);transform:scale(1.06)}
.rcard.isdone{opacity:.4}
.rcard .tag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--teal);color:#fff;border-radius:999px;padding:3px 12px;font-size:14px}
.rcard.next .tag{background:var(--soft)}
.rcard .check{position:absolute;inset:0;display:grid;place-items:center;font-size:90px;color:var(--ok)}

/* calma */
.calm{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:30px}
.breath{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E8F5F3,#9FD2CB);animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.7)}50%{transform:scale(1.5)}}
.calm p{font-size:28px;font-weight:800;color:var(--soft)}

/* historias */
.story{display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:6px}
.scene{width:min(560px,92vw);min-height:250px;border-radius:32px;background:var(--card);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px;font-size:min(26vw,130px);line-height:1;padding:20px;flex-wrap:wrap}
.scene img{width:200px;height:200px;object-fit:cover;border-radius:22px}
.stext{font-size:30px;font-weight:900;text-align:center;max-width:760px;line-height:1.3}
.snav{display:flex;gap:16px;align-items:center}
.snav .bigbtn{min-width:120px}
.sdots{display:flex;gap:8px}.sdots i{width:14px;height:14px;border-radius:50%;background:#E6DED0}.sdots i.on{background:var(--teal)}
/* modo sin animaciones */
body.still .opt.help{animation:none;border-width:6px}
body.still .opt.right{transform:none}
body.still .tile:active,body.still .picto:active,body.still .opt:active{transform:none}
body.still .rcard.now{transform:none}
/* área de padres */
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ptabs button{padding:12px 18px;border-radius:14px;font-weight:900;font-size:16px;background:var(--card);border:2px solid var(--line)}
.ptabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px}
.card h3{margin:0 0 4px;font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--soft);font-size:14px;font-weight:700;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.kpi .v{font-size:30px;font-weight:900}
.kpi .l{font-size:13px;font-weight:800;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:999px;font-size:14px;font-weight:800;background:var(--bg)}
.chip.good{background:var(--teal-soft);color:#24675F}
.chip.mid{background:var(--sun-soft);color:#8A5E10}
.chip.low{background:var(--rose-soft);color:#9A3F3C}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-weight:700;font-size:15px}
.row:last-child{border-bottom:0}
.row .r{color:var(--soft);text-align:right}
.bar{height:10px;border-radius:6px;background:#EFE9DF;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:6px}
.muted{color:var(--soft);font-weight:700;font-size:15px}
.note{background:var(--sun-soft);border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;color:#6E4F14;margin-bottom:14px}
label.f{display:block;font-weight:800;font-size:14px;color:var(--soft);margin:12px 0 6px}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);font-size:16px;background:#fff;color:var(--ink)}
textarea.inp{min-height:70px;resize:vertical}
.btn{padding:12px 18px;border-radius:14px;font-weight:900;font-size:16px;background:var(--teal);color:#fff}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:var(--rose-soft);color:#9A3F3C}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:11px}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.typebtn{padding:10px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:14px;text-align:left}
.typebtn.on{border-color:var(--ink);background:var(--ink);color:#fff}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.entry{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.entry .ic{font-size:26px}
.entry .t{flex:1;font-weight:700}
.entry .d{font-size:13px;color:var(--soft);font-weight:700}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.ck{padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:15px}
.ck.on{background:var(--teal-soft);border-color:var(--teal);color:#24675F}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;max-height:300px;overflow:auto;padding:4px}
.pick button{background:var(--bg);border-radius:14px;padding:8px 4px;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.pick .e{font-size:32px}
.pick img{width:40px;height:40px;object-fit:cover;border-radius:8px}
.status{font-size:13px;font-weight:800;color:var(--soft)}
.chart{width:100%;height:auto;display:block}
.overlay{position:fixed;inset:0;background:rgba(47,58,69,.35);display:grid;place-items:center;z-index:50;padding:20px}
.dialog{background:#fff;border-radius:24px;padding:22px;max-width:520px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.dialog h3{margin:0 0 8px;font-size:21px}
.dialog pre{white-space:pre-wrap;font-family:inherit;font-size:14px;background:var(--bg);padding:12px;border-radius:12px;max-height:50vh;overflow:auto;user-select:text;-webkit-user-select:text}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;z-index:60;max-width:90vw;text-align:center}
.legend{display:flex;gap:14px;font-size:13px;font-weight:800;color:var(--soft);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
</style>
</head>

let esVoice=null, nativeOK=false;
function loadVoices(){try{const vs=speechSynthesis.getVoices();if(vs&&vs.length){nativeOK=true;esVoice=vs.find(v=>/^es[-_]ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null}}catch(e){}}

function speak(text){
  if(!S.cfg.voice||!text)return;
  if(nativeOK){
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';if(esVoice)u.voice=esVoice;u.rate=S.cfg.rate;u.pitch=1.05;u.volume=S.cfg.volume;speechSynthesis.speak(u);return}catch(e){}
  }
}
let actx=null;
function chime(){
  if(!S.cfg.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const now=actx.currentTime;
    [523.25,659.25,783.99].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
      const t=now+i*.13;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07*S.cfg.volume,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.6);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.65)});
  }catch(e){}
}

function distinct(arr,n,key=x=>x.id){const out=[],seen=new Set();for(const x of shuffle(arr)){const k=key(x);if(!seen.has(k)){seen.add(k);out.push(x)}if(out.length>=n)break}return out}
const EXPERT={
  colores(n){const a=pick(COLOR_ASSOC),c=COLORS.find(x=>x.id===a.c);const others=distinct(COLORS.filter(x=>x.id!==c.id),n-1);
    return {tid:a.e+' '+a.w.replace(/^(el|la) /,''),answer:c.id,prompt:`¿De qué color es ${a.w}?`,okText:c.w,model:`<span class="emo">${a.e}</span>`,
      options:shuffle([c,...others]).map(o=>({id:o.id,lab:o.w,html:GAMES.colores.view(o)}))}},
  animales(n){const ids=Object.keys(ANIMAL_SOUND);const id=pick(ids),an=ANIMALS.find(x=>x.id===id);
    const others=distinct(ANIMALS.filter(x=>x.id!==id),n-1);
    return {tid:an.w+' ('+ANIMAL_SOUND[id]+')',answer:id,prompt:`¿Quién hace ${ANIMAL_SOUND[id]}?`,display:`¿Quién hace «${ANIMAL_SOUND[id]}»?`,okText:an.w,ear:true,
      options:shuffle([an,...others]).map(o=>({id:o.id,lab:o.w,html:GAMES.animales.view(o)}))}},
  numeros(n){const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*(10-a)),sum=a+b;
    let pool=NUMS.filter(x=>x.n!==sum&&x.n<=20).sort((x,y)=>Math.abs(x.n-sum)-Math.abs(y.n-sum)).slice(0,Math.max(n-1,6));
    const others=shuffle(pool).slice(0,n-1),ans=NUMS[sum-1];
    return {tid:`${a}+${b}`,answer:ans.id,prompt:`¿Cuánto es ${NUMWORD[a]} más ${NUMWORD[b]}?`,display:`${a} + ${b} = ?`,okText:NUMWORD[sum],wide:true,
      model:`<span class="num" style="font-size:84px">${a} + ${b}</span>`,options:shuffle([ans,...others]).map(o=>({id:o.id,lab:o.w,html:GAMES.numeros.view(o)}))}},
  formas(n){const base=COLORS.filter(c=>['rojo','azul','amarillo','verde','naranja','morado'].includes(c.id));
    const combos=[];SHAPES.forEach(s=>base.forEach(c=>combos.push({s,c,id:s.id+'_'+c.id})));
    const tgt=pick(combos);const adj=(s,c)=>s.a==='la'?(FEM[c.id]||c.w):c.w;const lab=x=>x.s.w+' '+adj(x.s,x.c);
    const near=combos.filter(x=>x.id!==tgt.id&&(x.s.id===tgt.s.id||x.c.id===tgt.c.id)),far=combos.filter(x=>x.id!==tgt.id&&!near.includes(x));
    const others=distinct(near,Math.min(n-1,Math.ceil((n-1)*.7))).concat(distinct(far,n-1));const opts=distinct(others,n-1);
    return {tid:lab(tgt),answer:tgt.id,prompt:`¿Dónde está ${tgt.s.a} ${lab(tgt)}?`,okText:lab(tgt),ear:true,
      options:shuffle([tgt,...opts]).map(o=>({id:o.id,lab:lab(o),html:shapeSVG(o.s.id,colorHex(o.c))}))}},
  emociones(n){const sit=pick(SITUATIONS),ans=EMOTIONS.find(e=>e.id===sit.a);const others=distinct(EMOTIONS.filter(e=>e.id!==ans.id),n-1);
    return {tid:sit.t,answer:ans.id,prompt:`${sit.t} ¿Cómo se siente?`,okText:ans.w,model:`<span class="emo">${sit.e}</span>`,wide:true,
      options:shuffle([ans,...others]).map(o=>({id:o.id,lab:o.w,html:GAMES.emociones.view(o)}))}},
};
function startGame(g){
  const G=GAMES[g],D=diff();let mode=S.cfg.modes[g]||G.modes[0];if(!G.modes.includes(mode))mode=G.modes[0];
  if(D.listen&&mode==='igual')mode='oir';
  S.game={g,mode,expert:!!(D.combos&&EXPERT[g]),level:Math.max(D.min,Math.min(D.max,S.cfg.levels[g]||D.min)),count:0,okStreak:0,badStreak:0,stars:0,last:null,trial:null,finished:false};
  newTrial();S.screen='game';render();const st0=S.game;setTimeout(()=>{if(S.game===st0)speak(st0.trial.prompt)},350);
}
function newTrial(){
  const st=S.game,G=GAMES[st.g],pool=enabledItems(st.g);
  let t=null;
  if(st.expert&&Math.random()<.75){
    for(let i=0;i<4;i++){t=EXPERT[st.g](st.level);if(t.tid!==st.last)break}
    t.m='reto';
  }else{
    let cands=pool.filter(i=>i.id!==st.last);if(!cands.length)cands=pool;
    const target=pick(cands),n=Math.min(st.level,pool.length);
    let others;
    if(st.g==='contar'){others=shuffle(pool.filter(i=>i.id!==target.id).sort((a,b)=>Math.abs(a.n-target.n)-Math.abs(b.n-target.n)).slice(0,Math.max(n-1,4))).slice(0,n-1)}
    else others=shuffle(pool.filter(i=>i.id!==target.id)).slice(0,n-1);
    const obj=pick(COUNT_OBJ);
    const model=st.mode==='contar'?`<div class="count" style="font-size:${target.n>8?40:52}px">${Array(target.n).fill(obj).join('')}</div>`:st.mode==='igual'?G.view(target):null;
    t={m:st.mode,tid:target.id,answer:target.id,prompt:G.ask(target),okText:G.ok(target),model,ear:st.mode==='oir',wide:st.mode==='contar',
      options:shuffle([target,...others]).map(o=>({id:o.id,lab:o.w,html:G.view(o)}))};
  }
  Object.assign(t,{start:performance.now(),wrongs:[],firstRt:null,done:false});
  st.trial=t;st.last=t.tid;
}
function vGame(){
  const st=S.game,G=GAMES[st.g],D=diff();
  if(st.finished){
    const canUp=st.stars>=ROUND&&D.id<4&&S.cfg.allowLevelUp!==false;
    return `<div class="top">${backBtn('games')}<h1>${G.name}</h1></div>
    <div class="done"><div class="stars">${'⭐'.repeat(Math.max(1,st.stars))}</div><h2>¡Muy bien${pname()?', '+esc(pname()):''}!</h2>
    <div class="btnrow">${canUp?`<button class="bigbtn" id="lvup" style="background:var(--sun);color:var(--ink)">⬆️ Subir a ${DIFF[D.id+1].name}</button>`:''}
    <button class="bigbtn" id="again">🔁 Otra vez</button><button class="bigbtn alt" data-go="games">🧩 Otro juego</button></div></div>`;
  }
  const t=st.trial,n=t.options.length;

  else if(t.model)prompt=`<div class="model ${t.wide?'wide':''}">${t.model}</div>`;
  prompt+=`<div class="ptext">${esc(t.display||t.prompt)}</div>`;
  return `<div class="top">${backBtn('games')}<h1>${G.name} <span class="muted" style="font-size:16px">· ${D.name}</span></h1>
      <div class="progress">${Array.from({length:ROUND},(_,i)=>`<i class="${i<st.count?'on':''}"></i>`).join('')}</div>
      <button class="iconbtn" id="rep" aria-label="Repetir">🔊</button></div>
    <div class="play"><div class="prompt">${prompt}</div>
    <div class="opts" style="grid-template-columns:repeat(${cols},minmax(0,1fr));max-width:${maxw}">
      ${t.options.map(o=>`<button class="opt" data-o="${esc(o.id)}">${o.html}</button>`).join('')}</div></div>`;
}
function bGame(){
  const st=S.game;
  if(st.finished){$('#again').onclick=()=>startGame(st.g);const up=$('#lvup');if(up)up.onclick=()=>{setDifficulty(diff().id+1);toast('Nivel '+diff().name+' ✓');startGame(st.g)};return}
  const rep=()=>speak(st.trial.prompt);
  $('#rep').onclick=rep;const r2=$('#rep2');if(r2)r2.onclick=rep;
  clearTimeout(st.idle);st.idle=setTimeout(()=>{if(S.game===st&&!st.trial.done)rep()},9000);
  $$('[data-o]').forEach(b=>b.onclick=()=>answer(b.dataset.o,b));
}
function answer(id,btn){
  const st=S.game,t=st.trial,D=diff();if(!t||t.done)return;
  if(t.firstRt==null)t.firstRt=Math.round(performance.now()-t.start);
  clearTimeout(st.idle);
  if(id===t.answer){
    t.done=true;const first=t.wrongs.length===0;
    let c=t.wrongs[0]||null;if(c&&t.m==='reto'){const o=t.options.find(x=>x.id===c);c=o?o.lab:c}
    today().trials.push({g:st.g,m:t.m,d:D.id,t:t.tid,n:t.options.length,ok:first?1:0,c,rt:t.firstRt,ts:Date.now()});
    Store.saveDay();
    btn.classList.remove('help');btn.classList.add('right');chime();
    speak(first?`¡Sí! ${t.okText}`:t.okText);
    if(first){st.stars++;st.okStreak++;st.badStreak=0;if(st.okStreak>=3&&st.level<D.max){st.level++;st.okStreak=0}}
    else{st.okStreak=0;st.badStreak++;if(st.badStreak>=2&&st.level>D.min){st.level--;st.badStreak=0}}
    S.cfg.levels[st.g]=st.level;Store.saveCfg();
    st.count++;
    setTimeout(()=>{if(S.game!==st)return;if(st.count>=ROUND){st.finished=true;render()}else{newTrial();render();setTimeout(()=>speak(st.trial.prompt),250)}},1300);
  }else{
    if(!t.wrongs.includes(id))t.wrongs.push(id);
    btn.classList.add('wrong');
    const right=$$('[data-o]').find(b=>b.dataset.o===t.answer);if(right)right.classList.add('help');
    setTimeout(()=>speak(t.prompt),300);
  }
}

/* ============ ANÁLISIS ============ */
function trialsSince(days){const from=Date.now()-days*864e5;return Object.values(S.days).flatMap(d=>d.trials||[]).filter(t=>t.ts>=from)}
function pictosSince(days){const from=Date.now()-days*864e5;return Object.values(S.days).flatMap(d=>d.pictos||[]).filter(p=>p.ts>=from)}
function itemName(g,id){const it=GAMES[g].items.find(i=>i.id===id);return it?(it.w):id}
function gameStats(g,days=30){
  const T=trialsSince(days).filter(t=>t.g===g);
  const byMode={};T.forEach(t=>{(byMode[t.m]=byMode[t.m]||[]).push(t)});
  const items={};T.forEach(t=>{const k=t.m+'|'+t.t;items[k]=items[k]||{n:0,ok:0,m:t.m,id:t.t};items[k].n++;items[k].ok+=t.ok});
  const conf={};T.forEach(t=>{if(t.c){const k=t.t+'|'+t.c;conf[k]=(conf[k]||0)+1}});
  const strictMode=g==='contar'?'contar':'oir';
  const mastered=[],learning=[],hard=[];
  GAMES[g].items.forEach(it=>{
    const s=items[strictMode+'|'+it.id], s2=items['igual|'+it.id];
    if(s&&s.n>=5&&s.ok/s.n>=.8)mastered.push(it);
    else if((s&&s.n>=3&&s.ok/s.n<.5)||(s2&&s2.n>=3&&s2.ok/s2.n<.5))hard.push(it);
    else if((s&&s.n)||(s2&&s2.n))learning.push(it);
  });
  return {T,byMode,items,conf:Object.entries(conf).sort((a,b)=>b[1]-a[1]).slice(0,4),mastered,learning,hard};
}
function dailySeries(n=14){
  const out=[];for(let i=n-1;i>=0;i--){const d=new Date(Date.now()-i*864e5);const k=dkey(d);const day=S.days[k]||{trials:[],pictos:[]};
    const T=day.trials||[];out.push({k,d,n:T.length,ok:T.filter(t=>t.ok).length,p:(day.pictos||[]).length})}
  return out;
}
function seriesChart(series){
  const W=640,H=180,pl=34,pb=26,bw=(W-pl-10)/series.length;
  const maxN=Math.max(5,...series.map(s=>s.n));
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Intentos y aciertos por día">`;
  [0,50,100].forEach(v=>{const y=H-pb-(H-pb-10)*v/100;g+=`<line x1="${pl}" x2="${W-6}" y1="${y}" y2="${y}" stroke="#EFE9DF"/><text x="${pl-6}" y="${y+4}" font-size="11" text-anchor="end" fill="#6B7785">${v}%</text>`});
  series.forEach((s,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64;
    const hN=(H-pb-10)*(s.n/maxN);g+=`<rect x="${x}" y="${H-pb-hN}" width="${w}" height="${hN}" rx="4" fill="#E7E5F6"/>`;
    if(s.n){const p=s.ok/s.n,y=H-pb-(H-pb-10)*p;g+=`<circle cx="${x+w/2}" cy="${y}" r="5" fill="#3E9C93"><title>${s.k}: ${Math.round(p*100)}% a la primera (${s.n} intentos)</title></circle>`}
    const lab=s.d.toLocaleDateString('es-ES',{weekday:'narrow'});g+=`<text x="${x+w/2}" y="${H-8}" font-size="11" text-anchor="middle" fill="#6B7785">${lab}${s.d.getDate()}</text>`});
  // línea de aciertos
  const pts=series.map((s,i)=>s.n?[pl+i*bw+bw/2,H-pb-(H-pb-10)*(s.ok/s.n)]:null).filter(Boolean);
  if(pts.length>1)g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#3E9C93" stroke-width="2.5" stroke-linejoin="round"/>`;
  return g+'</svg>';
}
function diaryPatterns(days=30){
  const from=Date.now()-days*864e5;const E=S.diary.filter(e=>e.ts>=from);
  const byType={};E.forEach(e=>{(byType[e.type]=byType[e.type]||[]).push(e)});
  const top=(arr,f)=>{const m={};arr.forEach(e=>{const v=(f(e)||'').trim().toLowerCase();if(v)m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const crisis=byType.crisis||[];const per={};crisis.forEach(e=>{const p=period(e.ts);per[p]=(per[p]||0)+1});
  return {E,byType,videos:top(byType.video||[],e=>e.text),reps:top(byType.repetitiva||[],e=>e.text),
    triggers:top(crisis,e=>e.trigger),helped:top(crisis,e=>e.helped),crisisPer:Object.entries(per).sort((a,b)=>b[1]-a[1])};
}

function storiesHTML(){

  const sc={};SV.forEach(x=>{sc[x.id]=(sc[x.id]||0)+1});
  return Object.entries(sc).sort((a,b)=>b[1]-a[1]).map(([id,n])=>{const st=STORIES.find(y=>y.id===id);return `<div class="row"><span>${st?st.e+' '+esc(st.name):esc(id)}</span><span class="r">${n}</span></div>`}).join('');

    $$('[data-set]').forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.set.split(':');c[k]=v==='1';save()});
    $$('[data-rate]').forEach(b=>b.onclick=()=>{c.rate=+b.dataset.rate;save()});
    $$('[data-vol]').forEach(b=>b.onclick=()=>{c.volume=+b.dataset.vol;save()});
    $('#testv').onclick=()=>{const was=c.voice;c.voice=true;speak('Hola, ¿dónde está el perro?');c.voice=was};
    $$('[data-mode]').forEach(b=>b.onclick=()=>{const [g,m]=b.dataset.mode.split(':');c.modes[g]=m;save()});
    $$('[data-en]').forEach(b=>b.onclick=()=>{const [g,id]=b.dataset.en.split(':');const cur=(c.enabled[g]||GAMES[g].def).slice();
      const i=cur.indexOf(id);if(i>=0){if(cur.length<=2){toast('Deja al menos 2 activos');return}cur.splice(i,1)}else cur.push(id);c.enabled[g]=cur;save()});
    $$('[data-rdel]').forEach(b=>b.onclick=()=>{c.routine.splice(+b.dataset.rdel,1);save()});
    $$('[data-radd]').forEach(b=>b.onclick=()=>{if(c.routine.length>=8){toast('Máximo 8 pasos');return}c.routine.push(b.dataset.radd);save()});
    $('#phadd').onclick=addPhoto;
    const bx=$('#bkExport');if(bx)bx.onclick=exportBackup;
    const bi=$('#bkImport');if(bi)bi.onchange=()=>{const f=bi.files[0];if(f)importBackup(f)};
    $$('[data-phdel]').forEach(b=>b.onclick=()=>confirmBox('¿Quitar esta foto?',()=>{const id=b.dataset.phdel;S.custom=S.custom.filter(p=>p.id!==id);c.routine=c.routine.filter(r=>r!==id);Store.savePictos();Store.saveCfg();keep()}));
    $('#wipe').onclick=()=>confirmBox('Se borrarán todos los resultados de juegos, pictos usados y notas del diario. No se puede deshacer.',async()=>{await Store.wipe();toast('Datos borrados');keep()});
  }
}
function readDraft(){const t=$('#dtext');if(t)draft.text=t.value;const tr=$('#dtrig');if(tr)draft.trigger=tr.value;const h=$('#dhelp');if(h)draft.helped=h.value}
function addPhoto(){
  const name=$('#phname').value.trim(),f=$('#phfile').files[0];
  if(!name||!f){toast('Pon un nombre y elige una foto');return}
  if(S.custom.length>=24){toast('Máximo 24 fotos');return}
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{const s=220,cv=document.createElement('canvas');cv.width=s;cv.height=s;const ctx=cv.getContext('2d');
    const m=Math.min(img.width,img.height);ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);URL.revokeObjectURL(url);
    const data=cv.toDataURL('image/jpeg',.72);S.custom.push({id:'c'+uid(),w:name,img:data});Store.savePictos();toast('Foto añadida ✓');
    const y=window.scrollY;render();window.scrollTo(0,y)};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('No se pudo leer la imagen')};img.src=url;
}
function exportBackup(){
  Store.flushAll();Store.cacheLocal();
  const data={app:'ComprenTEA',v:1,ts:Date.now(),common:{custom:S.custom,profiles:S.profiles},profiles:{}};
  S.profiles.forEach(p=>{data.profiles[p.id]=p.id===S.pid?{cfg:S.cfg,days:S.days,diary:S.diary}:(lsGet(KEYS.profile(p.id))||null)});
  try{const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=`comprentea-copia-${dkey()}.json`;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Copia descargada ✓')}catch(e){toast('No se pudo descargar la copia')}
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){toast('Ese archivo no es una copia válida');return}
    if(!d||d.app!=='ComprenTEA'||!d.common||!d.profiles){toast('Ese archivo no es una copia de ComprenTEA');return}
    confirmBox('Se reemplazarán los datos de este dispositivo por los de la copia.',async()=>{
      lsSet('comprentea-common',d.common);
      Object.entries(d.profiles).forEach(([pid,v])=>{if(v)lsSet(KEYS.profile(pid),v)});
      const first=(d.common.profiles||[])[0];lsSet(KEYS.active,first?first.id:'main');
      S.loaded=false;render();await Store.init();
      toast('Copia restaurada ✓');go('home')});
  };
  r.readAsText(file);
}
function confirmBox(msg,onYes){
  const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="dialog"><h3>¿Seguro?</h3><p class="muted">${esc(msg)}</p><div class="btnrow" style="justify-content:flex-end"><button class="btn alt" id="cno">Cancelar</button><button class="btn danger" id="cyes">Sí, borrar</button></div></div>`;
  document.body.appendChild(o);$('#cno',o).onclick=()=>o.remove();$('#cyes',o).onclick=()=>{o.remove();onYes()};o.onclick=e=>{if(e.target===o)o.remove()};
}
function buildReport(){
  const name=pname()||'sin nombre';const L=[];
  L.push(`Informe de ComprenTEA — ${name} — ${new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}`);
  L.push('Datos de los últimos 30 días, registrados en casa con la app.','');
  const T=trialsSince(30);
  L.push(`JUEGOS: ${T.length} respuestas en ${dailySeries(30).filter(s=>s.n).length} días; acierto a la primera ${pct(T.filter(t=>t.ok).length,T.length)}%.`);
  Object.entries(GAMES).forEach(([g,G])=>{const s=gameStats(g);if(!s.T.length)return;
    const modes=[...new Set([...G.modes,...Object.keys(s.byMode)])].map(m=>{const t=s.byMode[m]||[];return t.length?`${MODE_LABEL[m].replace(/^\S+ /,'')}: ${pct(t.filter(x=>x.ok).length,t.length)}% (${t.length})`:null}).filter(Boolean).join(' · ');
    L.push(`- ${G.name}: ${modes}.`);
    if(s.mastered.length)L.push(`  Comprende: ${s.mastered.map(i=>i.w).join(', ')}.`);
    if(s.hard.length)L.push(`  Le cuesta: ${s.hard.map(i=>i.w).join(', ')}.`);
    if(s.conf.length)L.push(`  Confusiones: ${s.conf.map(([k,n])=>{const [a,b]=k.split('|');return itemName(g,a)+'→'+itemName(g,b)+' ('+n+')'}).join(', ')}.`)});
  const P=pictosSince(30);const pc={};P.forEach(p=>{pc[p.w]=(pc[p.w]||0)+1});
  L.push('',`COMUNICACIÓN: ${P.length} pictos pulsados.${P.length?' Más usados: '+Object.entries(pc).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([w,n])=>w+' ('+n+')').join(', ')+'.':''}`);
  const SV=Object.values(S.days).flatMap(d=>d.stories||[]).filter(x=>x.ts>=Date.now()-30*864e5);
  if(SV.length){const sc={};SV.forEach(x=>{const st=STORIES.find(y=>y.id===x.id);const n=st?st.name:x.id;sc[n]=(sc[n]||0)+1});
    L.push('',`HISTORIAS: ${SV.length} vistas. ${Object.entries(sc).sort((a,b)=>b[1]-a[1]).map(([n,c])=>n+' ('+c+')').join(', ')}.`)}
  const dp=diaryPatterns(30);
  L.push('','DIARIO DE LOS PADRES:');
  DIARY_TYPES.forEach(t=>{const n=(dp.byType[t.id]||[]).length;if(n)L.push(`- ${t.name}: ${n} anotaciones.`)});
  if(dp.videos.length)L.push(`- Vídeos/canciones que más repite: ${dp.videos.slice(0,3).map(v=>v[0]+' ('+v[1]+')').join(', ')}.`);
  if(dp.reps.length)L.push(`- Conductas repetitivas: ${dp.reps.slice(0,3).map(v=>v[0]+' ('+v[1]+')').join(', ')}.`);
  if(dp.crisisPer.length)L.push(`- Crisis sobre todo por la ${dp.crisisPer[0][0]}.${dp.triggers.length?' Desencadenantes: '+dp.triggers.slice(0,3).map(v=>v[0]+' ('+v[1]+')').join(', ')+'.':''}${dp.helped.length?' Ayuda: '+dp.helped.slice(0,3).map(v=>v[0]).join(', ')+'.':''}`);
  const com=(dp.byType.comunica||[]).slice(0,6);if(com.length)L.push(`- Sonidos/palabras: ${com.map(e=>e.text).join('; ')}.`);
  L.push('','Nota: registro casero orientativo, no es una evaluación clínica.');
  return L.join('\n');
}
function showReport(){
  const txt=buildReport();const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="dialog"><h3>📄 Informe para el logopeda / terapeuta</h3><pre id="rtxt">${esc(txt)}</pre>
    <div class="btnrow" style="justify-content:flex-end;margin-top:12px"><button class="btn alt" id="rclose">Cerrar</button><button class="btn" id="rcopy">Copiar texto</button></div></div>`;
  document.body.appendChild(o);$('#rclose',o).onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()};
  $('#rcopy',o).onclick=()=>{try{navigator.clipboard.writeText(txt).then(()=>toast('Copiado ✓ Pégalo en WhatsApp o email'),()=>toast('Selecciona el texto y cópialo a mano'))}catch(e){toast('Selecciona el texto y cópialo a mano')}};
}

/* ============ ARRANQUE ============ */
if(('serviceWorker' in navigator)&&(location.protocol==='https:'||location.hostname==='localhost')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
render();
Store.init().then(()=>{render()});
</script>
